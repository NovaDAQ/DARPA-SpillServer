# logrotate.conf -- user-level log rotation for the gateway (plan D17).
#
# Runs as novadaq from cron, with its own state file (no root needed):
#
#   /usr/sbin/logrotate -s /home/novadaq/DARPA/publish/logrotate.state \
#       /home/novadaq/DARPA/publish/bin/logrotate.conf
#
# Test without rotating anything:
#
#   /usr/sbin/logrotate -d -s /home/novadaq/DARPA/publish/logrotate.state \
#       /home/novadaq/DARPA/publish/bin/logrotate.conf
#
# copytruncate everywhere: darpa-spill-server and cron's ">> LOG" keep their
# file descriptors open, so the file is copied and truncated in place rather
# than renamed. A few lines written during the copy can be lost; that is the
# accepted cost of not restarting the server.
#
# logrotate refuses a config file that is group- or world-writable; install.sh
# installs this one 0644.

# The server's own output; about 1 GB before rotation was set up.
# daily + maxsize: rotated once a day, or sooner if it passes 200 MB at a run.
/home/novadaq/DARPA/DARPA-SpillServer/run/spillserver.log {
    daily
    maxsize 200M
    rotate 14
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
}

# darpa-spill-publish and server-watchdog logs written by the crontab.
/data/DARPA-spilldata/publish/logs/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
}
