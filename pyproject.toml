[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "darpa-spillserver"
version = "1.3.0"
description = "Web and API server for NOvA accelerator event timestamps collected from a TDU"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary -- Copyright 2010-2026 Andrew Norman for Fermi Forward Discovery Group LLC. All rights reserved." }
authors = [{ name = "Andrew Norman", email = "anorman@fnal.gov" }]
keywords = ["nova", "daq", "fermilab", "accelerator", "spill", "tdu", "timestamp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: Other/Proprietary License",
    "Framework :: FastAPI",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.26",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "nova-time-decoder>=1.2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.23", "respx>=0.20"]
oidc = ["authlib>=1.3", "itsdangerous>=2.1"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "respx>=0.20", "authlib>=1.3", "itsdangerous>=2.1"]

[project.scripts]
darpa-spill-server = "darpa_spillserver.cli:main"
darpa-spill-query = "darpa_spillserver.query_cli:main"
darpa-spill-backfill = "darpa_spillserver.backfill:main"
darpa-spill-client = "darpa_spillserver.client_cli:main"

[project.urls]
Homepage = "https://github.com/NovaDAQ/DARPA-SpillServer"
Source = "https://github.com/NovaDAQ/DARPA-SpillServer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
darpa_spillserver = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:darpa_spillserver.*"]
